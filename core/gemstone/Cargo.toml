[package]
name = "gemstone"
version = "2.114.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "gemstone"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
diesel = { version = "2.0", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel-async = { version = "0.4", features = ["sqlite", "bb8"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1.0"
itertools = "0.14"
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
once_cell = "1.19"
percent-encoding = "2.3"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }

# Local crates
chain_primitives = { path = "../crates/chain_primitives" }
chain_traits = { path = "../crates/chain_traits" }
gem_algorand = { path = "../crates/gem_algorand" }
gem_aptos = { path = "../crates/gem_aptos" }
gem_auth = { path = "../crates/gem_auth" }
gem_bitcoin = { path = "../crates/gem_bitcoin" }
gem_bsc = { path = "../crates/gem_bsc" }
gem_cardano = { path = "../crates/gem_cardano" }
gem_cosmos = { path = "../crates/gem_cosmos" }
gem_crypto = { path = "../crates/gem_crypto" }
gem_derivation = { path = "../crates/gem_derivation" }
gem_encoding = { path = "../crates/gem_encoding" }
gem_evm = { path = "../crates/gem_evm" }
gem_hash = { path = "../crates/gem_hash" }
gem_hypercore = { path = "../crates/gem_hypercore" }
gem_jsonrpc = { path = "../crates/gem_jsonrpc" }
gem_keystore = { path = "../crates/gem_keystore" }
gem_near = { path = "../crates/gem_near" }
gem_polkadot = { path = "../crates/gem_polkadot" }
gem_solana = { path = "../crates/gem_solana" }
gem_stellar = { path = "../crates/gem_stellar" }
gem_sui = { path = "../crates/gem_sui" }
gem_ton = { path = "../crates/gem_ton" }
gem_tron = { path = "../crates/gem_tron" }
gem_wallet_connect = { path = "../crates/gem_wallet_connect" }
gem_xrp = { path = "../crates/gem_xrp" }
number_formatter = { path = "../crates/number_formatter" }
primitives = { path = "../crates/primitives" }
serde_serializers = { path = "../crates/serde_serializers" }
signer = { path = "../crates/signer" }
simulation = { path = "../crates/simulation" }
support = { path = "../crates/support" }
swapper = { path = "../crates/swapper" }
yielder = { path = "../crates/yielder" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[features]
default = []
reqwest_provider = []
